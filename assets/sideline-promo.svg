      <circle cx="245" cy="40" r="23" fill="#E8386D"/>
      <circle cx="90" cy="130" r="23" fill="#F2B705"/>
      <circle cx="270" cy="220" r="23" fill="#7C5CF0"/>
      <circle cx="170" cy="310" r="23" fill="#1FA97B"/>
    </g>
    <circle cx="170" cy="130" r="29" fill="#F0522B" stroke="#21160E" stroke-width="3"/>
    <circle cx="170" cy="123" r="9" fill="#FFE0D5"/>
    <path d="M155 145 q15 -15 30 0" fill="#FFE0D5"/>
    <circle cx="295" cy="40" r="10" fill="#1FA97B" stroke="#fff" stroke-width="2"/>
    <path d="M290 40 l4 4 l6 -7" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M50 310 V282" stroke="#21160E" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M50 282 L70 289 L50 296 Z" fill="#F0522B" stroke="#21160E" stroke-width="2" stroke-linejoin="round"/>
