<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-labelledby="t">
  <title id="t">Sideline: a marathon course folded like a snake, with friends' faces along it and the finished stretch in green</title>
  <rect width="880" height="360" rx="28" fill="#FFF4E3"/>
  <circle cx="800" cy="40" r="120" fill="#FFF0C9"/>
  <circle cx="60" cy="330" r="90" fill="#FFE0D5"/>

  <g transform="translate(470 40)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 40 H300 A45 45 0 0 1 300 130 H40 A45 45 0 0 0 40 220 H300 A45 45 0 0 1 300 310 H50" stroke="#21160E" stroke-width="33"/>
      <path d="M40 40 H300 A45 45 0 0 1 300 130 H40 A45 45 0 0 0 40 220 H300 A45 45 0 0 1 300 310 H50" stroke="#FFFFFF" stroke-width="27"/>
      <path d="M40 40 H300 A45 45 0 0 1 300 130 H170" stroke="#1FA97B" stroke-width="27"/>
      <path d="M90 220 H230" stroke="#FFF0C9" stroke-width="27"/>
    </g>
    <circle cx="40" cy="40" r="7" fill="#21160E"/>
